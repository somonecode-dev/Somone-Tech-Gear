<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Panier - SOMONE.GEAR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="10" fill="url(#logo-grad)"/>
            <path d="M26 13H17.5C15.5 13 14 14.5 14 16.5C14 18.5 15.5 20 17.5 20H22.5C24.5 20 26 21.5 26 23.5C26 25.5 24.5 27 22.5 27H14" 
                  stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="26" cy="13" r="2" fill="#22d3ee"/>
            <circle cx="14" cy="27" r="2" fill="#22d3ee"/>
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0284c7"/>
                <stop offset="1" stop-color="#0f172a"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          SOMONE<span class="text-cyan">.GEAR</span>
        </div>
      </a>

      <ul class="nav-links" id="nav-menu">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="produits.html">Boutique</a></li>
        <li><a href="wishlist.html">Favoris</a></li>
        <li><a href="panier.html" class="active">Panier</a></li>
      </ul>

      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" title="Changer de thème">🌙</button>
        <a href="wishlist.html" class="icon-btn" title="Mes Favoris">
          ❤️ <span id="wishlist-badge" class="badge">0</span>
        </a>
        <a href="panier.html" class="icon-btn" title="Mon Panier">
          🛒 <span id="cart-badge" class="badge">0</span>
        </a>
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL DU PANIER -->
  <main class="container page-content">
    <h1 class="page-title">Votre Panier</h1>

    <div class="cart-layout">
      <!-- Liste des articles -->
      <section class="cart-items-container" id="cart-items-container">
        <!-- Généré dynamiquement par JS -->
      </section>

      <!-- Récapitulatif Commande -->
      <aside class="cart-summary" id="cart-summary">
        <h2>Récapitulatif</h2>
        <div class="summary-row">
          <span>Sous-total</span>
          <span id="summary-subtotal">0 FCFA</span>
        </div>
        <div class="summary-row">
          <span>Livraison</span>
          <span id="summary-shipping">2 000 FCFA</span>
        </div>
        <hr class="summary-divider">
        <div class="summary-row total-row">
          <span>Total</span>
          <span id="summary-total">0 FCFA</span>
        </div>
        <button class="checkout-btn" id="checkout-btn" onclick="processCheckout()">
          Passer la commande
        </button>
        <button class="clear-cart-btn" onclick="clearCart()">
          Vider le panier
        </button>
      </aside>
    </div>

    <!-- HISTORIQUE DES COMMANDES -->
    <section class="orders-section" id="orders-section">
      <h2 class="section-title">📦 Mes Commandes Récentes</h2>
      <div id="orders-history-container">
        <!-- Généré dynamiquement par JS -->
      </div>
    </section>
  </main>

  <!-- MODALE DE CONFIRMATION / ALERTE -->
 <div id="custom-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-icon" id="modal-icon">✅</div>
    <h3 id="modal-title">Titre de la modale</h3>
    <p id="modal-message">Message explicatif ici...</p>
    <div class="modal-actions">
      <button id="modal-cancel-btn" class="modal-btn btn-secondary">Annuler</button>
      <button id="modal-confirm-btn" class="modal-btn btn-primary">Confirmer</button>
    </div>
  </div>
 </div>

  <!-- SCRIPTS -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/panier.js"></script>
</body>
</html>
