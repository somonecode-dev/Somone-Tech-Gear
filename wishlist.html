<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Favoris - SOMONE.GEAR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER OFFICIEL UNIFIÉ -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="10" fill="url(#logo-grad)"/>
            <path d="M26 13H17.5C15.5 13 14 14.5 14 16.5C14 18.5 15.5 20 17.5 20H22.5C24.5 20 26 21.5 26 23.5C26 25.5 24.5 27 22.5 27H14" 
                  stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="26" cy="13" r="2" fill="#22d3ee"/>
            <circle cx="14" cy="27" r="2" fill="#22d3ee"/>
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0284c7"/>
                <stop offset="1" stop-color="#0f172a"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          SOMONE<span class="text-cyan">.GEAR</span>
        </div>
      </a>

      <ul class="nav-links" id="nav-menu">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="produits.html">Boutique</a></li>
        <li><a href="wishlist.html" class="active">Favoris</a></li>
        <li><a href="panier.html">Panier</a></li>
      </ul>

      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" title="Changer de thème">🌙</button>
        <a href="wishlist.html" class="icon-btn" title="Mes Favoris">
          ❤️ <span id="wishlist-badge" class="badge">0</span>
        </a>
        <a href="panier.html" class="icon-btn" title="Mon Panier">
          🛒 <span id="cart-badge" class="badge">0</span>
        </a>
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENU FAVORIS -->
  <main class="container page-content">
    <section class="page-header">
      <h1 class="page-title">Mes Produits Favoris</h1>
      <p>Retrouvez tous les articles que vous avez ajoutés à vos coups de cœur.</p>
    </section>

    <!-- Grille des Favoris / État Vide -->
    <div id="wishlist-container" class="products-grid">
      <!-- Généré dynamiquement en JS -->
    </div>
  </main>

  <!-- MODALE APERÇU RAPIDE -->
  <div id="quickview-modal" class="modal-overlay">
    <div class="modal-content product-modal-content">
      <button class="modal-close-btn" onclick="closeQuickView()">&times;</button>
      <div class="product-modal-grid">
        <div class="product-gallery">
          <div class="main-image-container">
            <img id="qv-main-img" src="" alt="Produit">
          </div>
          <div class="thumbnails-container" id="qv-thumbnails"></div>
        </div>
        <div class="product-modal-info">
          <span id="qv-category" class="product-badge"></span>
          <h2 id="qv-title"></h2>
          <p id="qv-price" class="qv-price-tag"></p>
          <p id="qv-description"></p>
          <div class="qv-actions">
            <button id="qv-add-btn" class="btn-primary">🛒 Ajouter au panier</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
